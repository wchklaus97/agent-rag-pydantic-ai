[project]
name = "agent-rag-pydantic-ai"
version = "0.1.0"
description = "Agent-first RAG: retrieval is a typed tool the Pydantic AI agent decides to call"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic-ai-slim[openai]>=1.0",
    "sqlite-vec>=0.1.6",
    "pypdf>=4.0",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
agentrag = "agentrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
